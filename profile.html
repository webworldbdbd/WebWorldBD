<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | WebWorldBD</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="min-h-screen flex flex-col justify-between relative">

  <!-- Shared Header -->
  <div id="header-root"></div>

  <!-- Main Content -->
  <main class="relative z-10 flex-grow pt-8 pb-16 px-4 max-w-lg mx-auto w-full animate-fade-in-up">
    <div id="profile-card" class="glass-card p-6 md:p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-xl space-y-6">
      <!-- Loading State -->
      <div id="profile-loading" class="text-center py-10 space-y-3">
        <span class="spinner mx-auto border-sky-500 border-top-transparent w-8 h-8"></span>
        <p class="text-xs text-slate-500">Loading user profile...</p>
      </div>

      <!-- Profile Details (Hidden initially) -->
      <div id="profile-content" class="space-y-6 hidden">
        <!-- Top Banner Avatar -->
        <div class="text-center space-y-3">
          <div id="profile-avatar-wrapper" class="w-24 h-24 rounded-full bg-gradient-to-tr from-sky-400 to-indigo-500 mx-auto flex items-center justify-center text-white font-black text-3xl shadow-xl ring-4 ring-sky-300 dark:ring-sky-900 overflow-hidden">
            <span id="profile-initial">U</span>
            <img id="profile-photo" class="w-full h-full object-cover hidden" alt="User Profile">
          </div>

          <div>
            <h1 id="profile-name" class="text-xl font-extrabold text-slate-900 dark:text-white">
              User Name
            </h1>
            <p id="profile-email" class="text-xs font-semibold text-sky-500 dark:text-sky-400">
              user@example.com
            </p>
          </div>

          <span id="profile-role-badge" class="inline-block px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider bg-sky-100 text-sky-700 dark:bg-sky-950 dark:text-sky-300">
            User
          </span>
        </div>

        <!-- Meta Details -->
        <div class="space-y-3 bg-slate-50 dark:bg-slate-800/80 p-4 rounded-2xl border border-slate-200 dark:border-slate-700/60 text-xs text-slate-700 dark:text-slate-300">
          <div class="flex items-center justify-between">
            <span class="font-semibold text-slate-500 dark:text-slate-400">Account Status:</span>
            <span class="font-bold text-emerald-500 flex items-center gap-1">
              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              Active
            </span>
          </div>
          <div class="flex items-center justify-between">
            <span class="font-semibold text-slate-500 dark:text-slate-400">Member Since:</span>
            <span id="profile-created-date" class="font-bold text-slate-900 dark:text-white">--</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="font-semibold text-slate-500 dark:text-slate-400">User ID:</span>
            <span id="profile-uid" class="font-mono text-[10px] text-slate-500 truncate max-w-[150px]">--</span>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="pt-2 space-y-3">
          <button
            id="btn-profile-logout"
            class="w-full py-3.5 rounded-xl bg-red-500 hover:bg-red-600 text-white font-bold text-xs shadow-md transition-all cursor-pointer flex items-center justify-center gap-2"
          >
            <i class="fa-solid fa-right-from-bracket"></i>
            <span data-i18n="logOut">Log Out</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Shared Footer -->
  <div id="footer-root"></div>

  <script type="module" src="./js/main.js"></script>
  <script type="module">
    import { subscribeAuthState, logOut } from './js/auth.js';
    import { showToast } from './js/main.js';
    import { getLanguage } from './js/i18n.js';

    document.addEventListener('DOMContentLoaded', () => {
      const loading = document.getElementById('profile-loading');
      const content = document.getElementById('profile-content');
      const nameEl = document.getElementById('profile-name');
      const emailEl = document.getElementById('profile-email');
      const roleEl = document.getElementById('profile-role-badge');
      const createdEl = document.getElementById('profile-created-date');
      const uidEl = document.getElementById('profile-uid');
      const photoEl = document.getElementById('profile-photo');
      const initialEl = document.getElementById('profile-initial');
      const logoutBtn = document.getElementById('btn-profile-logout');

      subscribeAuthState((user, userData) => {
        if (!user) {
          showToast(getLanguage() === 'en' ? "Please log in to view your profile." : "প্রোফাইল দেখতে লগ ইন করুন।", "info");
          window.location.href = './login.html';
          return;
        }

        loading?.classList.add('hidden');
        content?.classList.remove('hidden');

        const displayName = userData?.name || user.displayName || 'WebWorldBD User';
        nameEl.textContent = displayName;
        emailEl.textContent = user.email || '';
        uidEl.textContent = user.uid || '--';

        const created = userData?.createdAt ? new Date(userData.createdAt).toLocaleDateString() : 'Recent';
        createdEl.textContent = created;

        const role = userData?.role || (user.email === 'webworldbd.lmt@gmail.com' ? 'admin' : 'user');
        roleEl.textContent = role.toUpperCase();
        if (role === 'admin') {
          roleEl.className = 'inline-block px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider bg-purple-100 text-purple-700 dark:bg-purple-950 dark:text-purple-300';
        }

        if (user.photoURL) {
          photoEl.src = user.photoURL;
          photoEl.classList.remove('hidden');
          initialEl.classList.add('hidden');
        } else {
          initialEl.textContent = displayName.charAt(0).toUpperCase();
          initialEl.classList.remove('hidden');
          photoEl.classList.add('hidden');
        }
      });

      logoutBtn?.addEventListener('click', async () => {
        await logOut();
        showToast(getLanguage() === 'en' ? "Logged out successfully." : "সফলভাবে লগ আউট হয়েছে।", "success");
        window.location.href = './index.html';
      });
    });
  </script>
</body>
</html>

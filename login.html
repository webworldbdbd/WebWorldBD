<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | WebWorldBD</title>
    <link rel="icon" type="image/png" href="./assets/logo.png?v=2">
  <link rel="apple-touch-icon" href="./assets/logo.png?v=2">
  <meta property="og:image" content="https://webworldbdbd.github.io/WebWorldBD/assets/logo.png?v=2">
  <meta name="twitter:image" content="https://webworldbdbd.github.io/WebWorldBD/assets/logo.png?v=2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="min-h-screen flex flex-col justify-between relative">

  <!-- Shared Header -->
  <div id="header-root"></div>

  <!-- Main Content -->
  <main class="relative z-10 flex-grow pt-10 pb-16 px-4 max-w-md mx-auto w-full animate-fade-in-up">
    <div class="glass-card p-6 md:p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-xl space-y-6">

      <!-- Card Header -->
      <div class="text-center space-y-2">
        <img src="./assets/logo.png?v=2" alt="WebWorldBD" class="h-12 w-auto object-contain mx-auto drop-shadow-xs" onerror="this.outerHTML='<span class=\'font-black text-2xl text-slate-900 dark:text-white\'>WebWorldBD</span>'">
        <h1 class="text-2xl font-black text-slate-900 dark:text-white" data-i18n="logIn">
          Log In
        </h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">
          Welcome back to WebWorldBD
        </p>
      </div>

      <!-- Form -->
      <form id="login-form" class="space-y-4">
        <!-- Email -->
        <div class="space-y-1">
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300" data-i18n="emailLabel">
            Email Address
          </label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
              <i class="fa-solid fa-envelope"></i>
            </span>
            <input
              type="email"
              id="login-email"
              required
              placeholder="name@example.com"
              class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/80 dark:bg-slate-800/80 text-slate-900 dark:text-white text-xs font-medium focus:outline-hidden focus:ring-2 focus:ring-sky-500 transition-all"
            >
          </div>
        </div>

        <!-- Password -->
        <div class="space-y-1">
          <div class="flex items-center justify-between">
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300" data-i18n="passwordLabel">
              Password
            </label>
            <a href="./forgot-password.html" class="text-[11px] font-bold text-sky-500 hover:underline" data-i18n="forgotPasswordLink">
              Forgot password?
            </a>
          </div>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input
              type="password"
              id="login-password"
              required
              minlength="6"
              placeholder="••••••••"
              class="w-full pl-10 pr-10 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/80 dark:bg-slate-800/80 text-slate-900 dark:text-white text-xs font-medium focus:outline-hidden focus:ring-2 focus:ring-sky-500 transition-all"
            >
            <button
              type="button"
              id="btn-toggle-login-password"
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
            >
              <i class="fa-solid fa-eye" id="eye-icon"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="btn-login-submit"
          class="w-full py-3.5 rounded-xl btn-primary-gradient font-bold text-xs shadow-md hover:shadow-lg transition-all cursor-pointer flex items-center justify-center gap-2"
        >
          <span id="login-submit-text" data-i18n="logIn">Log In</span>
          <span id="login-submit-spinner" class="spinner hidden"></span>
        </button>
      </form>

      <!-- Divider -->
      <div class="relative flex items-center justify-center">
        <div class="border-t border-slate-200 dark:border-slate-700 w-full"></div>
        <span class="bg-white dark:bg-slate-900 px-3 text-[10px] font-bold text-slate-400 uppercase tracking-widest absolute">
          OR
        </span>
      </div>

      <!-- Google Button -->
      <button
        type="button"
        id="btn-google-login"
        class="w-full py-3 rounded-xl bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 font-bold text-xs shadow-xs transition-all flex items-center justify-center gap-2.5 cursor-pointer"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span data-i18n="googleContinue">Continue with Google</span>
      </button>

      <!-- Bottom link -->
      <p class="text-center text-xs font-semibold text-slate-600 dark:text-slate-400">
        <span data-i18n="dontHaveAccount">Don't have an account?</span>
        <a href="./signup.html" class="text-sky-500 hover:underline font-bold ml-1" data-i18n="signUp">
          Sign Up
        </a>
      </p>
    </div>
  </main>

  <!-- Shared Footer -->
  <div id="footer-root"></div>

  <script type="module" src="./js/main.js"></script>
  <script type="module">
    import { logIn, logInWithGoogle } from './js/auth.js';
    import { showToast } from './js/main.js';
    import { getLanguage } from './js/i18n.js';

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('login-form');
      const submitBtn = document.getElementById('btn-login-submit');
      const submitText = document.getElementById('login-submit-text');
      const submitSpinner = document.getElementById('login-submit-spinner');
      const togglePasswordBtn = document.getElementById('btn-toggle-login-password');
      const passwordInput = document.getElementById('login-password');
      const eyeIcon = document.getElementById('eye-icon');
      const googleBtn = document.getElementById('btn-google-login');

      // Toggle password visibility
      togglePasswordBtn?.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          eyeIcon.className = 'fa-solid fa-eye-slash';
        } else {
          passwordInput.type = 'password';
          eyeIcon.className = 'fa-solid fa-eye';
        }
      });

      // Submit Login Form
      form?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = passwordInput.value;

        if (!email || !password) return;

        submitBtn.disabled = true;
        submitSpinner.classList.remove('hidden');

        try {
          await logIn(email, password);
          showToast(getLanguage() === 'en' ? "Logged in successfully!" : "সফলভাবে লগ ইন করা হয়েছে!", "success");
          window.location.href = './index.html';
        } catch (err) {
          const msg = getLanguage() === 'bn' ? err.messageBn : err.messageEn;
          showToast(msg || "Login failed.", "error");
        } finally {
          submitBtn.disabled = false;
          submitSpinner.classList.add('hidden');
        }
      });

      // Google Login
      googleBtn?.addEventListener('click', async () => {
        try {
          await logInWithGoogle();
          showToast(getLanguage() === 'en' ? "Signed in with Google!" : "Google দিয়ে সফলভাবে লগ ইন হয়েছে!", "success");
          window.location.href = './index.html';
        } catch (err) {
          const msg = getLanguage() === 'bn' ? err.messageBn : err.messageEn;
          showToast(msg || "Google Sign-in failed.", "error");
        }
      });
    });
  </script>
</body>
</html>

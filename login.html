<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      try {
        var t = localStorage.getItem('webworldbd_theme') || 'light';
        if (t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="email=no, telephone=no, address=no">
  <title>Log In | WebWorldBD</title>
  <link rel="icon" type="image/png" href="./assets/logo.png?v=2">
  <link rel="apple-touch-icon" href="./assets/logo.png?v=2">
  <meta property="og:image" content="https://webworldbd.pages.dev/assets/logo.png?v=2">
  <meta name="twitter:image" content="https://webworldbd.pages.dev/assets/logo.png?v=2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="auth-page min-h-screen flex flex-col justify-between relative overflow-x-hidden">

  <!-- Ambient 3D Blurred Gradient Orbs Background -->
  <div class="contact-orbs-container" aria-hidden="true">
    <div class="contact-orb orb-sky"></div>
    <div class="contact-orb orb-purple"></div>
    <div class="contact-orb orb-pink"></div>
  </div>

  <!-- Shared Header -->
  <div id="header-root"></div>

  <!-- Main Content -->
  <main class="relative z-10 flex-grow pt-6 pb-28 md:pb-16 px-4 max-w-[440px] mx-auto w-full flex flex-col items-center justify-center">

    <!-- Back to Home Pill -->
    <div class="mb-5 text-center">
      <a href="./index.html" class="btn-back-home-pill">
        <i class="fa-solid fa-arrow-left text-xs"></i>
        <span data-i18n="backToHome">Back to Home</span>
      </a>
    </div>

    <!-- 3D Frosted Glass Auth Card -->
    <div class="auth-glass-card p-6 sm:p-8 w-full space-y-6">

      <!-- Logo & Heading -->
      <div class="text-center space-y-3">
        <div class="auth-logo-tile">
          <img
            src="./assets/logo.png?v=2"
            alt="WebWorldBD"
            class="h-10 w-auto object-contain drop-shadow-xs"
            onerror="this.outerHTML='<span class=\'font-black text-xl text-sky-500\'>WBD</span>'"
          >
        </div>
        <div class="space-y-1">
          <h1 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight" data-i18n="logIn">
            Log In
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">
            Welcome back to WebWorldBD
          </p>
        </div>
      </div>

      <!-- Form -->
      <form id="login-form" class="space-y-4" novalidate>
        <!-- Email Field -->
        <div class="auth-input-group space-y-1.5">
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 transition-colors" data-i18n="emailLabel">
            Email Address
          </label>
          <div class="relative flex items-center">
            <div class="absolute left-2.5 z-10 auth-input-tile-icon pointer-events-none">
              <i class="fa-solid fa-envelope text-xs"></i>
            </div>
            <input
              type="email"
              id="login-email"
              required
              placeholder="name@example.com"
              class="auth-input-field"
            >
            <i class="fa-solid fa-circle-check auth-valid-check" id="email-valid-icon"></i>
          </div>
          <div class="auth-field-error" id="email-error">Please enter a valid email address.</div>
        </div>

        <!-- Password Field -->
        <div class="auth-input-group space-y-1.5">
          <div class="flex items-center justify-between">
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 transition-colors" data-i18n="passwordLabel">
              Password
            </label>
            <a href="./forgot-password.html" class="auth-link-gradient text-[11px]" data-i18n="forgotPasswordLink">
              Forgot password?
            </a>
          </div>
          <div class="relative flex items-center">
            <div class="absolute left-2.5 z-10 auth-input-tile-icon pointer-events-none">
              <i class="fa-solid fa-lock text-xs"></i>
            </div>
            <input
              type="password"
              id="login-password"
              required
              minlength="6"
              placeholder="••••••••"
              class="auth-input-field"
            >
            <button
              type="button"
              id="btn-toggle-login-password"
              aria-label="Toggle Password Visibility"
              class="absolute right-3.5 z-10 btn-auth-eye"
            >
              <i class="fa-solid fa-eye" id="eye-icon"></i>
            </button>
          </div>
          <div class="auth-field-error" id="password-error">Password must be at least 6 characters.</div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="btn-login-submit"
          class="btn-auth-primary"
        >
          <span id="login-submit-text" data-i18n="logIn">Log In</span>
          <span id="login-submit-spinner" class="spinner hidden"></span>
        </button>
      </form>

      <!-- OR Divider -->
      <div class="relative flex items-center justify-center my-4">
        <div class="border-t border-slate-200 dark:border-slate-800 w-full"></div>
        <span class="auth-divider-pill absolute">
          OR
        </span>
      </div>

      <!-- Google Button -->
      <button
        type="button"
        id="btn-google-login"
        class="btn-auth-google"
      >
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span data-i18n="googleContinue">Continue with Google</span>
      </button>

      <!-- Bottom link -->
      <p class="text-center text-xs font-semibold text-slate-600 dark:text-slate-400 pt-1">
        <span data-i18n="dontHaveAccount">Don't have an account?</span>
        <a href="./signup.html" class="auth-link-gradient ml-1" data-i18n="signUp">
          Sign Up
        </a>
      </p>
    </div>

    <!-- Trust Badges Row -->
    <div class="trust-badges-row">
      <div class="trust-badge-pill">
        <i class="fa-solid fa-lock"></i>
        <span data-i18n="secureLogin">Secure Login</span>
      </div>
      <div class="trust-badge-pill">
        <i class="fa-solid fa-shield-halved"></i>
        <span data-i18n="dataSafe">Your data is safe</span>
      </div>
      <div class="trust-badge-pill">
        <i class="fa-solid fa-bolt"></i>
        <span data-i18n="fastAccess">Fast Access</span>
      </div>
    </div>
  </main>

  <!-- Shared Footer -->
  <div id="footer-root"></div>

  <script type="module" src="./js/main.js"></script>
  <script type="module">
    import { logIn, logInWithGoogle } from './js/auth.js';
    import { isAdminUser } from './js/admin-config.js';
    import { showToast } from './js/main.js';
    import { getLanguage, t } from './js/i18n.js';

    function getPostAuthRedirectTarget(user) {
      const urlParams = new URLSearchParams(window.location.search);
      let next = urlParams.get('next');

      if (next) {
        next = next.trim();
        const isSameSiteRelative = !next.includes('://') && !next.startsWith('//') && /^(?:\.\/|\/[^\/]|[a-zA-Z0-9_\-\.]+(?:\.html)?(?:[\?#].*)?$)/.test(next);

        if (isSameSiteRelative) {
          if (next.includes('admin')) {
            if (isAdminUser(user)) {
              return './admin.html';
            } else {
              return './index.html';
            }
          }
          return next.startsWith('./') || next.startsWith('/') ? next : `./${next}`;
        }
      }

      if (isAdminUser(user) && window.location.search.includes('next=')) {
        return './admin.html';
      }

      return './profile.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Preserve ?next= in link to signup page if present
      if (window.location.search) {
        const signupLink = document.querySelector('a[href="./signup.html"]');
        if (signupLink) {
          signupLink.href = `./signup.html${window.location.search}`;
        }
      }
      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('login-email');
      const passwordInput = document.getElementById('login-password');
      const submitBtn = document.getElementById('btn-login-submit');
      const submitSpinner = document.getElementById('login-submit-spinner');
      const togglePasswordBtn = document.getElementById('btn-toggle-login-password');
      const eyeIcon = document.getElementById('eye-icon');
      const googleBtn = document.getElementById('btn-google-login');

      const emailValidIcon = document.getElementById('email-valid-icon');
      const emailError = document.getElementById('email-error');
      const passwordError = document.getElementById('password-error');

      // Toggle password visibility
      togglePasswordBtn?.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          eyeIcon.className = 'fa-solid fa-eye-slash';
        } else {
          passwordInput.type = 'password';
          eyeIcon.className = 'fa-solid fa-eye';
        }
      });

      // Live Email Validation
      emailInput?.addEventListener('input', () => {
        const val = emailInput.value.trim();
        const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
        if (isValid) {
          emailValidIcon?.classList.add('show');
          emailError?.classList.remove('show');
        } else {
          emailValidIcon?.classList.remove('show');
        }
      });

      // Live Password Validation
      passwordInput?.addEventListener('input', () => {
        if (passwordInput.value.length >= 6) {
          passwordError?.classList.remove('show');
        }
      });

      // Submit Login Form
      form?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        let hasError = false;
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          emailError?.classList.add('show');
          hasError = true;
        } else {
          emailError?.classList.remove('show');
        }

        if (!password || password.length < 6) {
          passwordError?.classList.add('show');
          hasError = true;
        } else {
          passwordError?.classList.remove('show');
        }

        if (hasError) return;

        submitBtn.disabled = true;
        submitSpinner.classList.remove('hidden');

        try {
          const res = await logIn(email, password);
          showToast(getLanguage() === 'en' ? "Logged in successfully!" : "সফলভাবে লগ ইন করা হয়েছে!", "success");
          window.location.href = getPostAuthRedirectTarget(res?.user);
        } catch (err) {
          const msg = getLanguage() === 'bn' ? err.messageBn : err.messageEn;
          showToast(msg || "Login failed.", "error");
        } finally {
          submitBtn.disabled = false;
          submitSpinner.classList.add('hidden');
        }
      });

      // Google Login
      googleBtn?.addEventListener('click', async () => {
        if (googleBtn.disabled) return;
        googleBtn.disabled = true;
        try {
          const res = await logInWithGoogle();
          showToast(getLanguage() === 'en' ? "Signed in with Google!" : "Google দিয়ে সফলভাবে লগ ইন হয়েছে!", "success");
          window.location.href = getPostAuthRedirectTarget(res?.user);
        } catch (err) {
          const msg = getLanguage() === 'bn' ? err.messageBn : err.messageEn;
          showToast(msg || "Google Sign-in failed.", "error");
        } finally {
          googleBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>

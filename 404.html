<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      try {
        var t = localStorage.getItem('webworldbd_theme') || 'light';
        if (t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="email=no, telephone=no, address=no">
  <title>404 - Page Not Found | WebWorldBD</title>
  <link rel="icon" type="image/png" href="./assets/logo.png?v=2">
  <link rel="apple-touch-icon" href="./assets/logo.png?v=2">
  <meta property="og:image" content="https://webworldbd.pages.dev/assets/logo.png?v=2">
  <meta name="twitter:image" content="https://webworldbd.pages.dev/assets/logo.png?v=2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-950 text-white relative overflow-x-hidden antialiased select-none">

  <!-- Ambient Blurred Orbs Background -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-20 -left-20 w-80 h-80 bg-sky-500/20 rounded-full blur-3xl"></div>
    <div class="absolute top-1/3 -right-20 w-80 h-80 bg-indigo-500/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-20 left-1/3 w-80 h-80 bg-purple-500/20 rounded-full blur-3xl"></div>
  </div>

  <main class="relative z-10 flex-1 flex items-center justify-center p-4 sm:p-6 text-center">
    <div class="max-w-md w-full bg-slate-900/80 backdrop-blur-xl border border-slate-800 p-8 rounded-3xl shadow-2xl space-y-6">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-sky-500/10 text-sky-400 border border-sky-500/20 text-4xl shadow-inner">
        <i class="fa-solid fa-compass-drafting"></i>
      </div>

      <div>
        <h1 class="text-6xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-sky-400 via-indigo-400 to-purple-400">404</h1>
        <h2 class="text-xl font-bold text-slate-100 mt-2" data-i18n="pageNotFound">Page Not Found</h2>
        <p class="text-xs text-slate-400 mt-2 font-medium" data-i18n="pageNotFoundDesc">
          The page you are looking for might have been moved, deleted, or does not exist.
        </p>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 pt-2">
        <a href="./index.html" class="flex-1 px-5 py-3 rounded-xl bg-sky-500 hover:bg-sky-600 text-white text-xs font-bold transition-all shadow-lg flex items-center justify-center gap-2">
          <i class="fa-solid fa-house"></i>
          <span data-i18n="goHome">Go Home</span>
        </a>
        <a href="./services.html" class="flex-1 px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold transition-all border border-slate-700 flex items-center justify-center gap-2">
          <i class="fa-solid fa-layer-group"></i>
          <span data-i18n="viewServices">Our Services</span>
        </a>
      </div>
    </div>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>

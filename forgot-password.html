<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Forgot Password | WebWorldBD</title>
    <link rel="icon" type="image/png" href="./assets/logo.png?v=2">
  <link rel="apple-touch-icon" href="./assets/logo.png?v=2">
  <meta property="og:image" content="https://webworldbdbd.github.io/WebWorldBD/assets/logo.png?v=2">
  <meta name="twitter:image" content="https://webworldbdbd.github.io/WebWorldBD/assets/logo.png?v=2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="min-h-screen flex flex-col justify-between relative">

  <!-- Shared Header -->
  <div id="header-root"></div>

  <!-- Main Content -->
  <main class="relative z-10 flex-grow pt-10 pb-16 px-4 max-w-md mx-auto w-full animate-fade-in-up">
    <div class="glass-card p-6 md:p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-xl space-y-6">

      <!-- Card Header -->
      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-amber-100 dark:bg-amber-950/80 text-amber-500 flex items-center justify-center font-extrabold text-2xl mx-auto shadow-xs">
          <i class="fa-solid fa-key"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-900 dark:text-white" data-i18n="resetPasswordTitle">
          Reset Password
        </h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium" data-i18n="resetPasswordDesc">
          Enter your email address and we will send you a link to reset your password.
        </p>
      </div>

      <!-- Form -->
      <form id="forgot-form" class="space-y-4">
        <!-- Email -->
        <div class="space-y-1">
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300" data-i18n="emailLabel">
            Email Address
          </label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
              <i class="fa-solid fa-envelope"></i>
            </span>
            <input
              type="email"
              id="reset-email"
              required
              placeholder="name@example.com"
              class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/80 dark:bg-slate-800/80 text-slate-900 dark:text-white text-xs font-medium focus:outline-hidden focus:ring-2 focus:ring-sky-500 transition-all"
            >
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="btn-reset-submit"
          class="w-full py-3.5 rounded-xl btn-primary-gradient font-bold text-xs shadow-md hover:shadow-lg transition-all cursor-pointer flex items-center justify-center gap-2"
        >
          <span id="reset-submit-text" data-i18n="sendResetLink">Send Reset Link</span>
          <span id="reset-submit-spinner" class="spinner hidden"></span>
        </button>
      </form>

      <!-- Back to login link -->
      <p class="text-center text-xs font-semibold text-slate-600 dark:text-slate-400 pt-2 border-t border-slate-200 dark:border-slate-800">
        <a href="./login.html" class="text-sky-500 hover:underline font-bold inline-flex items-center gap-1">
          <i class="fa-solid fa-arrow-left"></i>
          <span data-i18n="backToLogin">Back to Log In</span>
        </a>
      </p>
    </div>
  </main>

  <!-- Shared Footer -->
  <div id="footer-root"></div>

  <script type="module" src="./js/main.js"></script>
  <script type="module">
    import { resetPassword } from './js/auth.js';
    import { showToast } from './js/main.js';
    import { getLanguage } from './js/i18n.js';

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgot-form');
      const submitBtn = document.getElementById('btn-reset-submit');
      const submitSpinner = document.getElementById('reset-submit-spinner');

      form?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('reset-email').value.trim();
        if (!email) return;

        submitBtn.disabled = true;
        submitSpinner.classList.remove('hidden');

        try {
          await resetPassword(email);
          showToast(
            getLanguage() === 'en'
              ? "Password reset email sent! Please check your inbox."
              : "পাসওয়ার্ড রিসেট ইমেইল পাঠানো হয়েছে! আপনার ইনবক্স চেক করুন।",
            "success"
          );
        } catch (err) {
          const msg = getLanguage() === 'bn' ? err.messageBn : err.messageEn;
          showToast(msg || "Failed to send reset link.", "error");
        } finally {
          submitBtn.disabled = false;
          submitSpinner.classList.add('hidden');
        }
      });
    });
  </script>
</body>
</html>

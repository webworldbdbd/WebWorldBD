<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      try {
        var t = localStorage.getItem('webworldbd_theme') || 'light';
        if (t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="email=no, telephone=no, address=no">
  <title>Forgot Password | WebWorldBD</title>
  <link rel="icon" type="image/png" href="./assets/logo.png?v=2">
  <link rel="apple-touch-icon" href="./assets/logo.png?v=2">
  <meta property="og:image" content="https://webworldbd.pages.dev/assets/logo.png?v=2">
  <meta name="twitter:image" content="https://webworldbd.pages.dev/assets/logo.png?v=2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="auth-page min-h-screen flex flex-col justify-between relative overflow-x-hidden">

  <!-- Ambient 3D Blurred Gradient Orbs Background -->
  <div class="contact-orbs-container" aria-hidden="true">
    <div class="contact-orb orb-sky"></div>
    <div class="contact-orb orb-purple"></div>
    <div class="contact-orb orb-pink"></div>
  </div>

  <!-- Shared Header -->
  <div id="header-root"></div>

  <!-- Main Content -->
  <main class="relative z-10 flex-grow pt-6 pb-28 md:pb-16 px-4 max-w-[440px] mx-auto w-full flex flex-col items-center justify-center">

    <!-- Back to Home Pill -->
    <div class="mb-5 text-center">
      <a href="./index.html" class="btn-back-home-pill">
        <i class="fa-solid fa-arrow-left text-xs"></i>
        <span data-i18n="backToHome">Back to Home</span>
      </a>
    </div>

    <!-- 3D Frosted Glass Auth Card -->
    <div class="auth-glass-card p-6 sm:p-8 w-full space-y-6">

      <!-- Logo & Heading -->
      <div class="text-center space-y-3">
        <div class="auth-logo-tile text-amber-500 text-2xl">
          <i class="fa-solid fa-key"></i>
        </div>
        <div class="space-y-1">
          <h1 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight" data-i18n="resetPasswordTitle">
            Reset Password
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 font-medium leading-relaxed" data-i18n="resetPasswordDesc">
            Enter your email address and we will send you a link to reset your password.
          </p>
        </div>
      </div>

      <!-- Form -->
      <form id="forgot-form" class="space-y-4" novalidate>
        <!-- Email Field -->
        <div class="auth-input-group space-y-1.5">
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 transition-colors" data-i18n="emailLabel">
            Email Address
          </label>
          <div class="relative flex items-center">
            <div class="absolute left-2.5 z-10 auth-input-tile-icon pointer-events-none">
              <i class="fa-solid fa-envelope text-xs"></i>
            </div>
            <input
              type="email"
              id="reset-email"
              required
              placeholder="name@example.com"
              class="auth-input-field"
            >
            <i class="fa-solid fa-circle-check auth-valid-check" id="reset-email-valid-icon"></i>
          </div>
          <div class="auth-field-error" id="reset-email-error">Please enter a valid email address.</div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="btn-reset-submit"
          class="btn-auth-primary"
        >
          <span id="reset-submit-text" data-i18n="sendResetLink">Send Reset Link</span>
          <span id="reset-submit-spinner" class="spinner hidden"></span>
        </button>
      </form>

      <!-- Back to login link -->
      <p class="text-center text-xs font-semibold text-slate-600 dark:text-slate-400 pt-2 border-t border-slate-200/80 dark:border-slate-800/80">
        <a href="./login.html" class="auth-link-gradient inline-flex items-center gap-1.5">
          <i class="fa-solid fa-arrow-left text-[10px]"></i>
          <span data-i18n="backToLogin">Back to Log In</span>
        </a>
      </p>
    </div>

    <!-- Trust Badges Row -->
    <div class="trust-badges-row">
      <div class="trust-badge-pill">
        <i class="fa-solid fa-lock"></i>
        <span data-i18n="secureLogin">Secure Login</span>
      </div>
      <div class="trust-badge-pill">
        <i class="fa-solid fa-shield-halved"></i>
        <span data-i18n="dataSafe">Your data is safe</span>
      </div>
      <div class="trust-badge-pill">
        <i class="fa-solid fa-bolt"></i>
        <span data-i18n="fastAccess">Fast Access</span>
      </div>
    </div>
  </main>

  <!-- Shared Footer -->
  <div id="footer-root"></div>

  <script type="module" src="./js/main.js"></script>
  <script type="module">
    import { resetPassword } from './js/auth.js';
    import { showToast } from './js/main.js';
    import { getLanguage, t } from './js/i18n.js';

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgot-form');
      const emailInput = document.getElementById('reset-email');
      const submitBtn = document.getElementById('btn-reset-submit');
      const submitSpinner = document.getElementById('reset-submit-spinner');
      const emailValidIcon = document.getElementById('reset-email-valid-icon');
      const emailError = document.getElementById('reset-email-error');

      // Live Email Validation
      emailInput?.addEventListener('input', () => {
        const val = emailInput.value.trim();
        const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
        if (isValid) {
          emailValidIcon?.classList.add('show');
          emailError?.classList.remove('show');
        } else {
          emailValidIcon?.classList.remove('show');
        }
      });

      // Submit Form
      form?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();

        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          emailError?.classList.add('show');
          return;
        } else {
          emailError?.classList.remove('show');
        }

        submitBtn.disabled = true;
        submitSpinner.classList.remove('hidden');

        try {
          await resetPassword(email);
          showToast(
            getLanguage() === 'en'
              ? "Password reset email sent! Please check your inbox."
              : "পাসওয়ার্ড রিসেট ইমেইল পাঠানো হয়েছে! আপনার ইনবক্স চেক করুন।",
            "success"
          );
        } catch (err) {
          const msg = getLanguage() === 'bn' ? err.messageBn : err.messageEn;
          showToast(msg || "Failed to send reset link.", "error");
        } finally {
          submitBtn.disabled = false;
          submitSpinner.classList.add('hidden');
        }
      });
    });
  </script>
</body>
</html>
